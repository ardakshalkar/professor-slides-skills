# Five beats. Note that the visual variation across the deck is not imposed —
# it falls out of the beats, because each one asks the room to do something
# different.
beats:
  - beat: open-lecture
    goal: place the session in the sequence
    entry_question: What was that 0.97 last week actually telling us?
    exit_understanding: >-
      The student knows the session is about what a score is evidence for.
    transition_question: So what was wrong with the number?
    slides: [1, 2]

  - beat: problem-before-solution
    goal: make the room want held-out evaluation before it is named
    entry_question: Why would a score measured after training be misleading?
    exit_understanding: >-
      The student can say which question a training score answers and which one
      it does not.
    transition_question: What would we have to hold back to answer the other one?
    slides: [3, 4]

  - beat: intuition-to-definition
    goal: separate overfitting the phenomenon from the symptom they already know
    entry_question: Is a high score the problem?
    exit_understanding: >-
      The student can diagnose overfitting from the gap between two curves rather
      than from either number alone.
    transition_question: How do you decide which reported score to believe?
    slides: [5, 6]

  - beat: compare-alternatives
    goal: turn the principle into a criterion they can apply to somebody's report
    entry_question: Three numbers, three ways of measuring — which one survives?
    exit_understanding: >-
      The student can say why a best-of-forty validation score is a training score.
    transition_question: Can you apply that to a claim you have not seen before?
    slides: [7]

  - beat: story-so-far
    goal: restore their position before MODULE-07 builds on it
    entry_question: What do we now know about reading a reported score?
    exit_understanding: >-
      The student can state the rule and knows what next week adds to it.
    slides: [8, 9]

