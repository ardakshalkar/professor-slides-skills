# The render contract for MODULE-06-slides.md.
#
# `minutes` and `purpose` become the speaker notes, which is why they are here
# and not on the slides. `archetype` is carried across from the outline: the
# renderer sets a question or a big idea large and leaves its whitespace alone
# rather than flowing it like body copy.
#
# The titles must match the markdown's headings exactly; `pres render` stops on
# a mismatch rather than reordering anything.

plan_version: 1
deck: MODULE-06-slides.md
title: Model evaluation and overfitting
outline: MODULE-06-slides.outline.yaml
status: approved
max_slides: 12

# The title slide's picture would go here, and the renderer would bleed it down
# the right of slide 1 with the text column narrowing to suit:
#
#   title_slide:
#     image: MODULE-06-title.jpg
#     image_alt: An empty lecture theatre seen from the back row.
#
# It is commented out because no image ships in this repository, and a plan
# naming a file that is not beside the deck renders with a warning. An image
# there is the one picture in a deck allowed to carry no information — and it
# should be an image rather than a diagram: a mechanism on the title slide shows
# the payoff before anything has asked the question. See references/typography.md.

slides:
  - number: 1
    title: Model evaluation and overfitting
    archetype: section_opener
    minutes: 1
    purpose: open

  - number: 2
    title: Where we are
    archetype: roadmap
    minutes: 6
    purpose: place the session — last week's split, this week's question
    required_visual: the course arc, module 6 current and module 5 done

  - number: 3
    title: The number that meant nothing
    archetype: big_idea
    minutes: 12
    purpose: take last week's own result apart before introducing anything new

  - number: 4
    title: Three sets, and what each one is for
    archetype: annotated_object
    minutes: 12
    purpose: make the tuning/held-out distinction concrete before naming it
    required_visual: annotated train / validation / test split

  - number: 5
    title: Overfitting, stated precisely
    archetype: definition
    minutes: 14
    purpose: separate the phenomenon from the symptom students already know

  - number: 6
    title: Reading two curves
    archetype: visual_comparison
    minutes: 18
    purpose: the step people trip on — which gap is the diagnostic one
    required_visual: two runs, training against validation, with the gap marked

  - number: 7
    title: Which score do you believe?
    archetype: structured_comparison
    minutes: 14
    purpose: turn the principle into a criterion they can apply to a report

  - number: 8
    title: Check yourself
    archetype: activity
    minutes: 12
    # Not a `question` slide. That archetype is one large question and the
    # whitespace around it; this is two written problems the room works through,
    # which is an activity — and an activity slide carrying two of them is
    # moderate on purpose, so it says so rather than tripping the density check.
    density: moderate
    purpose: one problem per new concept; leave time for the answers

  - number: 9
    title: Next
    archetype: synthesis
    minutes: 4
    purpose: hand over to regularisation, and name the lab task
    required_visual: the same arc, module 6 done and module 7 next

figures:

  # The opening and closing arc: two files with identical geometry and the marker
  # moved, which is what `visual_anchor: course-arc` means on slides 2 and 9. One
  # picture the room comes to recognise beats two summaries of it.
  MODULE-06-slides-fig-03-arc-now.svg:
    title: The course arc, with module 6 current
    alt: >-
      Three modules left to right. Module 5, splitting data, is marked done.
      Module 6, evaluation and overfitting, is marked as where the course is
      now. Module 7, closing the gap, is marked next. The arrow out of module 5
      carries the score they reported.
  MODULE-06-slides-fig-04-arc-next.svg:
    title: The course arc, with module 6 done and module 7 next
    alt: >-
      The same three modules as the opening slide, with the marker moved:
      modules 5 and 6 are both marked done, and module 7, closing the gap, is
      now marked as where the course goes next.

  MODULE-06-slides-fig-02-curves.svg:
    title: Two training runs, compared by the gap between their curves
    alt: >-
      Two schematic plots of error against training epochs. In run A the
      training curve falls to near zero while the validation curve turns upward
      part way along, so the gap between them widens. In run B both curves fall
      together and flatten close to one another, at a worse error than run A
      reached.
  MODULE-06-slides-fig-01-split.svg:
    title: Train, validation and test split
    alt: >-
      Training data used to fit the model, validation data used to choose
      between models, and a test set held back and never touched during tuning
